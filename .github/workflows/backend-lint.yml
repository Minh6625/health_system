name: Backend Linting

on:
  push:
    branches: [deploy, main, "feat/**", "fix/**"]
    paths:
      - "backend/**"
  pull_request:
    branches: [deploy, main]
    paths:
      - "backend/**"

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort mypy

      - name: Check code formatting with Black
        working-directory: ./backend
        run: |
          black --check app/ tests/
        continue-on-error: true

      - name: Check import sorting with isort
        working-directory: ./backend
        run: |
          isort --check-only app/ tests/
        continue-on-error: true

      - name: Lint with flake8
        working-directory: ./backend
        run: |
          flake8 app/ tests/ --max-line-length=100 --ignore=E203,W503 --statistics
        continue-on-error: true

      - name: Type check with mypy
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          mypy app/ --ignore-missing-imports
        continue-on-error: true

      - name: Lint summary
        if: always()
        run: |
          echo "### Code Quality Results 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Black: Code formatting" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ isort: Import sorting" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ flake8: Code linting" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ mypy: Type checking" >> $GITHUB_STEP_SUMMARY
